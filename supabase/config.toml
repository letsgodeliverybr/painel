project_id = "astbkmpegcmqljltmdpx"

# Webhook público do iFood (X-IFood-Signature) — não pode exigir o JWT
# padrão do Supabase, o iFood não manda esse header. A autenticação real
# dessa function é a validação HMAC feita no próprio código (ver
# validarAssinaturaWebhook em ifood-status-sync/index.ts).
[functions.ifood-status-sync]
verify_jwt = false

# Chamadas direto pelo painel (browser, botões "Enviar agora"/"Testar" da
# aba Disparar Notificações) além do pg_cron — mesmo motivo/padrão de
# delete-entregador/update-entregador-email: autenticação via
# x-webhook-secret checado no próprio código, não pelo JWT do gateway.
[functions.lembrete-avaliacao]
verify_jwt = false

[functions.lembrete-indicacao]
verify_jwt = false

[functions.lembrete-periodico]
verify_jwt = false

# Redirect URI e Webhook URL do app cadastrado no Cardápio Web — chamadas
# vêm direto do navegador da loja (redirect do OAuth) e dos servidores
# deles (webhook), nenhum dos dois manda o JWT do Supabase. Mesmo motivo
# do ifood-status-sync acima.
[functions.cardapioweb-oauth-callback]
verify_jwt = false

[functions.cardapioweb-webhook-pedido]
verify_jwt = false

# Chamada direto por um trigger SQL (fn_intercept_realocacao_manual, via
# net.http_post) — mesmo padrão de autenticação por x-webhook-secret dos
# outros acima, não manda o JWT do Supabase.
[functions.notify-pedido-realocado]
verify_jwt = false

# Chamada direto do navegador (app.js, _notificarPedidoPronto()) — mesmo
# padrão de autenticação por x-webhook-secret, não manda o JWT do
# Supabase. Achado 2026-09-03: essa função não tinha entrada aqui (só um
# verify_jwt=false configurado no dashboard, fora do config.toml local) —
# redeployar via CLI sem essa entrada resetou pro default (exige JWT),
# quebrando a autenticação. Nunca mais redeployar sem essa entrada.
[functions.notify-novo-pedido]
verify_jwt = false
